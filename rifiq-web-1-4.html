// ---- Celebration confetti: fired on any successful log (fluid/food/weight/BP/session/lab) ----
const CONFETTI_COLORS = [DEEP, AMBER, CORAL, SAGE, PLUM, "#fff"];
function Confetti({ id }) {
  const pieces = useMemo(() => Array.from({ length: 46 }).map((_, i) => ({
    id: i,
    left: Math.random() * 100,
    size: 6 + Math.random() * 7,
    color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
    duration: 1.6 + Math.random() * 1.1,
    delay: Math.random() * 0.35,
    round: Math.random() > 0.5,
  })), [id]);
  return (
    <div style={{ position: "fixed", inset: 0, overflow: "hidden", pointerEvents: "none", zIndex: 90 }}>
      {pieces.map((p) => (
        <span key={p.id} className="rf-confetti-piece" style={{
          left: `${p.left}%`, width: p.size, height: p.size * (p.round ? 1 : 1.6),
          background: p.color, borderRadius: p.round ? "50%" : 2,
          animationDuration: `${p.duration}s`, animationDelay: `${p.delay}s`,
        }} />
      ))}
    </div>
  );
}

// ---- Sound effects + spoken voice lines ----
// "sip" and "clink" are synthesized live with the Web Audio API — no files needed, always works.
// If you'd rather use real recorded sound effects instead, drop sip.mp3/clink.mp3 into
// assets/public/sounds/ and they'll be used automatically in place of the synthesized tone.
const SOUND_FILES = { sip: "sounds/sip.mp3", clink: "sounds/clink.mp3" };
let _actx = null;
function getAudioCtx() {
  try {
    if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
    if (_actx.state === "suspended") _actx.resume();
    return _actx;
  } catch (e) { return null; }
}
function synthTone(kind) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  if (kind === "sip") {
    // soft descending gulp-like tone
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "sine"; osc.frequency.setValueAtTime(520, now); osc.frequency.exponentialRampToValueAtTime(240, now + 0.28);
    gain.gain.setValueAtTime(0.0001, now); gain.gain.exponentialRampToValueAtTime(0.22, now + 0.03); gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
    osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now + 0.32);
  } else if (kind === "clink") {
    // bright short glass-clink ding
    [1600, 2400].forEach((freq, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = "sine"; osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now); gain.gain.exponentialRampToValueAtTime(i === 0 ? 0.18 : 0.09, now + 0.01); gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
      osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now + 0.36);
    });
  }
}
function playSfx(key, volume = 1) {
  const src = SOUND_FILES[key];
  if (src) {
    try {
      const a = new Audio(src);
      a.volume = volume;
      a.onerror = () => synthTone(key);
      a.play().then(() => {}).catch(() => synthTone(key));
      return;
    } catch (e) {}
  }
  synthTone(key);
}

function speakFallback(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    const doSpeak = () => {
      const u = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices();
      const arVoice = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("ar"));
      if (arVoice) u.voice = arVoice;
      u.lang = "ar-EG";
      u.pitch = 1.15; u.rate = 0.95;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    };
    const existing = window.speechSynthesis.getVoices();
    if (existing.length > 0) { doSpeak(); return; }
    // Voices often load asynchronously on first use — wait for them once, then speak.
    window.speechSynthesis.onvoiceschanged = () => { doSpeak(); window.speechSynthesis.onvoiceschanged = null; };
    setTimeout(doSpeak, 400); // fallback in case the event never fires
  } catch (e) {}
}
function playVoiceLine(key) {
  const line = VOICE_LINES[key];
  if (!line) return;
  try {
    const a = new Audio(line.file);
    a.onerror = () => speakFallback(line.text);
    a.play().catch(() => speakFallback(line.text));
  } catch (e) { speakFallback(line.text); }
}

const LAB_TYPES = [
  { key: "potassium", label: "بوتاسيوم", unit: "mEq/L", min: 3.5, max: 5.5 },
  { key: "phosphorus", label: "فوسفور", unit: "mg/dL", min: 3.5, max: 5.5 },

];
function labFlag(type, value) {
  if (value == null) return "amber";
  if (value < type.min || value > type.max) return "red";
  return "green";
}

function App() {
  const [tab, setTab] = useState("home");
  const [loaded, setLoaded] = useState(false);
  const [limit, setLimit] = useState(1000);
  const [fluidLogs, setFluidLogs] = useState([]);
  const [weightLogs, setWeightLogs] = useState([]);
  const [foodLogs, setFoodLogs] = useState([]);
  const [bpLogs, setBpLogs] = useState([]);
  const [medLogs, setMedLogs] = useState([]);
  const [sessionLogs, setSessionLogs] = useState([]);
  const [labLogs, setLabLogs] = useState([]);
  const [showLimitEdit, setShowLimitEdit] = useState(false);
  const [showAddFluid, setShowAddFluid] = useState(false);
  const [showAddWeight, setShowAddWeight] = useState(false);
  const [showAddFood, setShowAddFood] = useState(false);
  const [showAddBP, setShowAddBP] = useState(false);
  const [showAddSession, setShowAddSession] = useState(false);
  const [showAddLab, setShowAddLab] = useState(false);
  const [openCard, setOpenCard] = useState(null);
  const [toast, setToast] = useState(null);
  const [needsOnboarding, setNeedsOnboarding] = useState(false);
  const [showDailySplash, setShowDailySplash] = useState(false);
  const [showCredits, setShowCredits] = useState(true);
  const [dailyChecks, setDailyChecks] = useState({});
  const [remindersOn, setRemindersOn] = useState(false);
  const [notifBusy, setNotifBusy] = useState(false);
  const [celebrateId, setCelebrateId] = useState(null);
  const celebrate = useCallback(() => {
    const id = Date.now();
    setCelebrateId(id);
    setTimeout(() => setCelebrateId((cur) => (cur === id ? null : cur)), 2600);
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const r = await store.get("rf-data");
        if (r && r.value) {
          const d = JSON.parse(r.value);
          setLimit(d.limit ?? 1000); setFluidLogs(d.fluidLogs ?? []);
          setWeightLogs(d.weightLogs ?? []); setDailyChecks(d.dailyChecks ?? {});
          setRemindersOn(d.remindersOn ?? false); setFoodLogs(d.foodLogs ?? []);
          setBpLogs(d.bpLogs ?? []); setMedLogs(d.medLogs ?? []); setSessionLogs(d.sessionLogs ?? []);
          setLabLogs(d.labLogs ?? []);
          setShowDailySplash(true);
        } else setNeedsOnboarding(true);
      } catch (e) { setNeedsOnboarding(true); }
      setLoaded(true);
    })();
  }, []);

  const persist = useCallback(async (next) => { try { await store.set("rf-data", JSON.stringify(next)); } catch (e) {} }, []);

  useEffect(() => {
    if (!loaded || needsOnboarding) return;
    persist({ limit, fluidLogs, weightLogs, dailyChecks, remindersOn, foodLogs, bpLogs, medLogs, sessionLogs, labLogs });
  }, [limit, fluidLogs, weightLogs, dailyChecks, remindersOn, foodLogs, bpLogs, medLogs, sessionLogs, labLogs, loaded, needsOnboarding, persist]);

  // ---- Native reminders: real Android notifications via Capacitor, survive app being closed ----
  const scheduleNativeReminders = async () => {
    const LN = LocalNotif();
    if (!LN) return false;
    const FLUID_TIMES = [10, 13, 16, 19]; // fixed daily check-in times
    const fluidNotifs = FLUID_TIMES.map((h, i) => ({
      id: 1000 + i,
      title: "رِفيق 💧",
      body: "متنساش تسجّل أي سوائل شربتها",
      schedule: { on: { hour: h, minute: 0 }, every: "day", allowWhileIdle: true },
    }));
    const ALL_TIPS = [...NUTRIENTS, ...DIALYSIS_INFO];
    const now = new Date();
    const tipNotifs = Array.from({ length: 14 }).map((_, i) => {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i + 1, 9, 0, 0);
      const pick = ALL_TIPS[d.getDate() % ALL_TIPS.length];
      return { id: 2000 + i, title: `رِفيق · ${pick.title} ${pick.icon}`, body: pick.tips[0], schedule: { at: d, allowWhileIdle: true } };
    });
    await LN.schedule({ notifications: [...fluidNotifs, ...tipNotifs] });
    return true;
  };
  const cancelNativeReminders = async () => {
    const LN = LocalNotif();
    if (!LN) return;
    const ids = [...Array.from({ length: 4 }, (_, i) => ({ id: 1000 + i })), ...Array.from({ length: 14 }, (_, i) => ({ id: 2000 + i }))];
    try { await LN.cancel({ notifications: ids }); } catch (e) {}
  };

  const enableReminders = async () => {
    const LN = LocalNotif();
    if (!LN) { showToast("الإشعارات شغالة بس جوه تطبيق رِفيق المثبّت"); return; }
    setNotifBusy(true);
    try {
      const perm = await LN.requestPermissions();
      if (perm.display !== "granted") { showToast("محتاجين إذن الإشعارات عشان نفكّرك"); setNotifBusy(false); return; }
      await scheduleNativeReminders();
      setRemindersOn(true);
      showToast("التذكير اتفعّل ✓");
    } catch (e) { showToast("حصلت مشكلة، جرب تاني"); }
    setNotifBusy(false);
  };
  const disableReminders = async () => { await cancelNativeReminders(); setRemindersOn(false); showToast("التذكير اتوقف"); };

  useEffect(() => {
    if (!loaded || needsOnboarding) return;
    const y = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    if (dailyChecks[y] !== undefined) return;
    const yTotal = fluidLogs.filter((l) => l.at.slice(0, 10) === y).reduce((s, l) => s + l.ml, 0);
    if (yTotal === 0) return;
    setDailyChecks((prev) => ({ ...prev, [y]: yTotal <= limit }));
  }, [loaded, needsOnboarding]);

  const streak = useMemo(() => {
    let s = 0, d = new Date(Date.now() - 86400000);
    while (true) {
      const key = d.toISOString().slice(0, 10);
      if (dailyChecks[key] === true) { s++; d = new Date(d.getTime() - 86400000); } else break;
    }
    return s;
  }, [dailyChecks]);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 1800); };

  const todayLogs = useMemo(() => fluidLogs.filter((l) => l.at.slice(0, 10) === todayKey()).sort((a, b) => (a.at < b.at ? 1 : -1)), [fluidLogs]);
  const todayTotal = useMemo(() => todayLogs.reduce((s, l) => s + l.ml, 0), [todayLogs]);
  const pct = Math.min(100, Math.round((todayTotal / Math.max(1, limit)) * 100));
  const remaining = limit - todayTotal;
  const glassColor = pct >= 100 ? CORAL : pct >= 80 ? AMBER : DEEP;

  const todayFood = useMemo(() => foodLogs.filter((f) => f.at.slice(0, 10) === todayKey()).sort((a, b) => (a.at < b.at ? 1 : -1)), [foodLogs]);

  const lastIDWG = useMemo(() => {
    if (weightLogs.length === 0) return null;
    const last = [...weightLogs].sort((a, b) => (a.date < b.date ? 1 : -1))[0];
    if (last.post == null || last.pre == null) return null;
    return +(last.post - last.pre).toFixed(1);
  }, [weightLogs]);

  const addFluid = (ml) => {
    setFluidLogs([{ id: Date.now(), ml, at: new Date().toISOString() }, ...fluidLogs]);
    setShowAddFluid(false); showToast(`اتسجل ${ml} مل`); celebrate();
    playSfx("sip"); setTimeout(() => playSfx("clink"), 380);
    setTimeout(() => playVoiceLine("fluid"), 900);
  };
  const removeFluid = (id) => setFluidLogs(fluidLogs.filter((l) => l.id !== id));
  const addWeight = (pre, post) => {
    setWeightLogs([{ id: Date.now(), date: todayKey(), pre, post }, ...weightLogs]);
    setShowAddWeight(false); showToast("اتسجل الوزن"); celebrate();
    playVoiceLine("weight");
  };
  const removeWeight = (id) => setWeightLogs(weightLogs.filter((l) => l.id !== id));
  const addFood = (entry) => {
    setFoodLogs([{ id: Date.now(), at: new Date().toISOString(), ...entry }, ...foodLogs]);
    setShowAddFood(false); showToast("اتسجل الأكل"); celebrate();
    playVoiceLine("food");
  };
  const removeFood = (id) => setFoodLogs(foodLogs.filter((f) => f.id !== id));

  const addBP = (systolic, diastolic, pulse) => {
    setBpLogs([{ id: Date.now(), date: todayKey(), at: new Date().toISOString(), systolic, diastolic, pulse }, ...bpLogs]);
    setShowAddBP(false); showToast("اتسجل الضغط"); celebrate();
    playVoiceLine("vitals");
  };
  const removeBP = (id) => setBpLogs(bpLogs.filter((b) => b.id !== id));

  const toggleMed = (mealKey) => {
    const today = todayKey();
    const existing = medLogs.find((m) => m.date === today && m.meal === mealKey);
    if (existing) setMedLogs(medLogs.filter((m) => m.id !== existing.id));
    else setMedLogs([{ id: Date.now(), date: today, meal: mealKey }, ...medLogs]);
  };

  const addSession = (attended, note) => {
    setSessionLogs([{ id: Date.now(), date: todayKey(), attended, note }, ...sessionLogs]);
    setShowAddSession(false); showToast(attended ? "اتسجلت الجلسة ✓" : "اتسجل الغياب");
    if (attended) celebrate();
  };
  const removeSession = (id) => setSessionLogs(sessionLogs.filter((s) => s.id !== id));

  const addLab = (values) => {
    setLabLogs([{ id: Date.now(), date: todayKey(), ...values }, ...labLogs]);
    setShowAddLab(false); showToast("اتسجلت نتيجة التحليل"); celebrate();
    playVoiceLine("vitals");
  };
  const removeLab = (id) => setLabLogs(labLogs.filter((l) => l.id !== id));

  const shareReport = async () => {
    const days = 7;
    const since = new Date(Date.now() - days * 86400000);
    const sinceKey = since.toISOString().slice(0, 10);
    const fluidDays = {};
    fluidLogs.filter((l) => l.at.slice(0, 10) >= sinceKey).forEach((l) => { fluidDays[l.at.slice(0, 10)] = (fluidDays[l.at.slice(0, 10)] || 0) + l.ml; });
    const fluidVals = Object.values(fluidDays);
    const avgFluid = fluidVals.length ? Math.round(fluidVals.reduce((a, b) => a + b, 0) / fluidVals.length) : 0;
    const overDays = fluidVals.filter((v) => v > limit).length;
    const recentW = weightLogs.filter((w) => w.date >= sinceKey);
    const avgGain = recentW.length ? (recentW.reduce((s, w) => s + (w.post - w.pre), 0) / recentW.length).toFixed(1) : "—";
    const recentBP = bpLogs.filter((b) => b.date >= sinceKey);
    const avgSys = recentBP.length ? Math.round(recentBP.reduce((s, b) => s + b.systolic, 0) / recentBP.length) : "—";
    const avgDia = recentBP.length ? Math.round(recentBP.reduce((s, b) => s + b.diastolic, 0) / recentBP.length) : "—";
    const missedSessions = sessionLogs.filter((s) => s.date >= sinceKey && !s.attended).length;
    const medDays = new Set(medLogs.filter((m) => m.date >= sinceKey).map((m) => m.date)).size;
    const lastLab = [...labLogs].sort((a, b) => (a.date < b.date ? 1 : -1))[0];
    const labLine = lastLab
      ? "\n🧪 آخر تحليل (" + fmtDate(lastLab.date) + "): " + LAB_TYPES.filter((t) => lastLab[t.key] != null).map((t) => `${t.label} ${lastLab[t.key]}`).join(" · ")
      : "";

    const text = `تقرير رِفيق — آخر ${days} أيام
━━━━━━━━━━━━━
💧 متوسط السوائل اليومي: ${avgFluid} مل (الحد: ${limit} مل)
   تجاوز الحد: ${overDays} من ${fluidVals.length || 0} أيام مسجّلة
⚖️ متوسط زيادة الوزن بين الجلسات: ${avgGain} كجم
🩺 متوسط الضغط: ${avgSys}/${avgDia}
💊 أيام أخذ حبوب الفوسفات: ${medDays} أيام
🏥 جلسات غسيل مفوّتة: ${missedSessions}${labLine}
━━━━━━━━━━━━━
تم إنشاؤه من تطبيق رِفيق`;

    const SharePlugin = Native()?.Plugins?.Share;
    if (SharePlugin) {
      try { await SharePlugin.share({ title: "تقرير رِفيق", text }); return; } catch (e) {}
    }
    try { await navigator.clipboard.writeText(text); showToast("اتنسخ التقرير — الصقه فين ما عايز"); }
    catch (e) { showToast("مقدرش أشارك من هنا"); }
  };

  if (showCredits) return <CreditsSplash onDone={() => setShowCredits(false)} />;
  if (!loaded) return <div style={{ minHeight: "100vh", background: SAND, display: "flex", alignItems: "center", justifyContent: "center", color: DEEP }}>بيتحمّل…</div>;
  if (needsOnboarding) return <Onboarding onDone={(v) => { setLimit(v); setNeedsOnboarding(false); persist({ limit: v, fluidLogs, weightLogs, dailyChecks, foodLogs: [] }); }} />;
  if (showDailySplash) return <DailySplash onDone={() => setShowDailySplash(false)} />;

  return (
    <div dir="rtl" style={styles.app}>
      <header style={styles.header}>
        <div style={styles.brandRow}><span style={styles.brandMark}>ر</span><span style={styles.brandName}>رِفيق</span></div>
        <div style={styles.brandSub}>رفيقك في رحلة الغسيل الكلوي</div>
      </header>

      <main style={styles.main}>
        {tab === "home" && <HomeTab pct={pct} glassColor={glassColor} todayTotal={todayTotal} limit={limit} remaining={remaining} lastIDWG={lastIDWG} streak={streak} onEditLimit={() => setShowLimitEdit(true)} onAddFluid={() => setShowAddFluid(true)} onGoLearn={() => setTab("learn")} remindersOn={remindersOn} notifBusy={notifBusy} onEnableReminders={enableReminders} onDisableReminders={disableReminders} medLogs={medLogs} onToggleMed={toggleMed} onShareReport={shareReport} />}
        {tab === "fluid" && <FluidTab pct={pct} glassColor={glassColor} todayTotal={todayTotal} limit={limit} remaining={remaining} todayLogs={todayLogs} onAdd={() => setShowAddFluid(true)} onRemove={removeFluid} />}
        {tab === "food" && <FoodTab todayFood={todayFood} onAdd={() => setShowAddFood(true)} onRemove={removeFood} />}
        {tab === "vitals" && <VitalsTab weightLogs={weightLogs} bpLogs={bpLogs} sessionLogs={sessionLogs} labLogs={labLogs} onAddWeight={() => setShowAddWeight(true)} onRemoveWeight={removeWeight} onAddBP={() => setShowAddBP(true)} onRemoveBP={removeBP} onAddSession={() => setShowAddSession(true)} onRemoveSession={removeSession} onAddLab={() => setShowAddLab(true)} onRemoveLab={removeLab} />}
        {tab === "learn" && <LearnTab openCard={openCard} setOpenCard={setOpenCard} onStartQuiz={() => { playVoiceLine("quiz"); setTab("quiz"); }} />}
        {tab === "quiz" && <QuizTab onExit={() => setTab("learn")} />}
      </main>

      <nav style={styles.nav}>
        <NavBtn active={tab === "home"} onClick={() => setTab("home")} icon={<IHome size={20} />} label="الرئيسية" />
        <NavBtn active={tab === "fluid"} onClick={() => setTab("fluid")} icon={<IDroplet size={20} />} label="السوائل" />
        <NavBtn active={tab === "food"} onClick={() => setTab("food")} icon={<IUtensils size={20} />} label="الأكل" />
        <NavBtn active={tab === "vitals"} onClick={() => setTab("vitals")} icon={<IHeartPulse size={20} />} label="الحيوية" />
        <NavBtn active={tab === "learn"} onClick={() => setTab("learn")} icon={<IBook size={20} />} label="تثقيف" />
      </nav>

      {showAddFluid && <AddFluidSheet onClose={() => setShowAddFluid(false)} onAdd={addFluid} />}
      {showAddWeight && <AddWeightSheet onClose={() => setShowAddWeight(false)} onAdd={addWeight} />}
      {showAddFood && <AddFoodSheet onClose={() => setShowAddFood(false)} onAdd={addFood} />}
      {showAddBP && <AddBPSheet onClose={() => setShowAddBP(false)} onAdd={addBP} />}
      {showAddSession && <AddSessionSheet onClose={() => setShowAddSession(false)} onAdd={addSession} />}
      {showAddLab && <AddLabSheet onClose={() => setShowAddLab(false)} onAdd={addLab} />}
      {showLimitEdit && <EditLimitSheet limit={limit} onClose={() => setShowLimitEdit(false)} onSave={(v) => { setLimit(v); setShowLimitEdit(false); }} />}
      {toast && <div style={styles.toast}>{toast}</div>}
      {celebrateId && <Confetti id={celebrateId} />}
    </div>
  );
}

function FluidTab({ pct, glassColor, todayTotal, limit, remaining, todayLogs, onAdd, onRemove }) {

function FluidGlass({ pct, color, total, limit, big }) {
  const h = big ? 150 : 100, w = big ? 100 : 70, fillH = (pct / 100) * (h - 10);
  return (
    <div style={{ display: "flex", justifyContent: "center" }}>
      <svg width={w + 20} height={h + 20} viewBox={`0 0 ${w + 20} ${h + 20}`}>
        <path d={`M10,10 L${w + 10},10 L${w},${h + 10} L20,${h + 10} Z`} fill="#fff" stroke={LINE} strokeWidth="2" />
        <clipPath id="glassClip"><path d={`M12,12 L${w + 8},12 L${w - 2},${h + 8} L22,${h + 8} Z`} /></clipPath>
        <g clipPath="url(#glassClip)">
          <rect x="10" y={h + 10 - fillH} width={w + 10} height={fillH + 10} fill={color} opacity="0.85" />
          <rect x="10" y={h + 10 - fillH} width={w + 10} height="6" fill={color} />
        </g>
        <path d={`M10,10 L${w + 10},10 L${w},${h + 10} L20,${h + 10} Z`} fill="none" stroke={LINE} strokeWidth="2" />
      </svg>
      <div style={{ display: "flex", flexDirection: "column", justifyContent: "center", marginRight: 14 }}>
        <div style={{ fontSize: big ? 30 : 22, fontWeight: 800, color: INK }}>{pct}٪</div>
        <div style={{ fontSize: 13, color: "#8a8a8a" }}>{total} / {limit} مل</div>
      </div>
    </div>
  );
}

function VitalsTab({ weightLogs, bpLogs, sessionLogs, labLogs, onAddWeight, onRemoveWeight, onAddBP, onRemoveBP, onAddSession, onRemoveSession, onAddLab, onRemoveLab }) {
  const [section, setSection] = useState("weight");
  const sortedW = useMemo(() => [...weightLogs].sort((a, b) => (a.date < b.date ? 1 : -1)), [weightLogs]);
  const maxW = useMemo(() => Math.max(1, ...weightLogs.map((w) => (w.post - w.pre) || 0)), [weightLogs]);
  const sortedBP = useMemo(() => [...bpLogs].sort((a, b) => (a.at < b.at ? 1 : -1)), [bpLogs]);
  const sortedS = useMemo(() => [...sessionLogs].sort((a, b) => (a.date < b.date ? 1 : -1)), [sessionLogs]);
  const sortedL = useMemo(() => [...labLogs].sort((a, b) => (a.date < b.date ? 1 : -1)), [labLogs]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16, animation: "rise .35s ease" }}>
      <div style={{ display: "flex", gap: 5, background: "#EFEAE0", borderRadius: 12, padding: 4, overflowX: "auto" }}>
        {[["weight", "الوزن"], ["bp", "الضغط"], ["lab", "التحاليل"], ["session", "الجلسات"]].map(([k, label]) => (
          <button key={k} onClick={() => setSection(k)} style={{
            flex: 1, padding: "9px 2px", borderRadius: 9, border: "none", cursor: "pointer", fontFamily: "inherit", fontWeight: 800, fontSize: 12.5, whiteSpace: "nowrap",
            background: section === k ? "#fff" : "transparent", color: section === k ? DEEP : "#8a8a8a",
          }}>{label}</button>
        ))}
      </div>

      {section === "weight" && (
        <>
          <section style={styles.card}>
            <div style={styles.cardTitle}>الزيادة بين الجلستين</div>
            <div style={{ fontSize: 12, color: "#8a8a8a", marginBottom: 10 }}>الهدف: أقل من 2–3 كيلو بين كل جلسة والتانية</div>
            {sortedW.length === 0 ? <div style={styles.empty}>سجّل وزنك قبل وبعد الجلسة عشان تتابع</div> : (
              <div style={{ display: "flex", gap: 8, alignItems: "flex-end", height: 90, padding: "0 4px" }}>
                {sortedW.slice(0, 8).reverse().map((w) => {
                  const gain = +(w.post - w.pre).toFixed(1), h = Math.max(6, (Math.abs(gain) / maxW) * 80);
                  const c = gain > 3 ? CORAL : gain > 2 ? AMBER : SAGE;
                  return (
                    <div key={w.id} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                      <div style={{ fontSize: 10, color: "#999" }}>{gain}</div>
                      <div style={{ width: "100%", height: h, background: c, borderRadius: 6 }} />
                      <div style={{ fontSize: 9, color: "#aaa" }}>{fmtDate(w.date)}</div>
                    </div>
                  );
                })}
              </div>
            )}
            <button onClick={onAddWeight} style={styles.primaryBtn}><IPlus size={18} /> سجّل وزن جلسة</button>
          </section>
          {sortedW.length > 0 && (
            <section>
              <div style={styles.sectionTitle}>السجل</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {sortedW.map((w) => {
                  const gain = +(w.post - w.pre).toFixed(1);
                  return (
                    <div key={w.id} style={styles.logRow}>
                      <div><div style={{ fontWeight: 700 }}>{fmtDate(w.date)} · زيادة {gain} كجم</div><div style={{ fontSize: 12, color: "#999" }}>قبل {w.pre} كجم ← بعد {w.post} كجم</div></div>
                      <button onClick={() => onRemoveWeight(w.id)} style={styles.iconBtn}><IX size={16} /></button>
                    </div>
                  );
                })}
              </div>
            </section>
          )}
        </>
      )}

      {section === "bp" && (
        <>
          <section style={styles.card}>
            <div style={styles.cardTitle}>ضغط الدم والنبض</div>
            <div style={{ fontSize: 12, color: "#8a8a8a", marginBottom: 10 }}>سجّله بانتظام، خصوصًا لو حاسس بدوخة أو تعب</div>
            <button onClick={onAddBP} style={styles.primaryBtn}><IPlus size={18} /> سجّل ضغط</button>
          </section>
          <section>
            <div style={styles.sectionTitle}>السجل</div>
            {sortedBP.length === 0 ? <div style={styles.empty}>لسه ما سجّلتش ضغط</div> : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {sortedBP.map((b) => {
                  const high = b.systolic >= 140 || b.diastolic >= 90;
                  const low = b.systolic < 90;
                  const c = high ? CORAL : low ? AMBER : SAGE;
                  return (
                    <div key={b.id} style={styles.logRow}>
                      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <IHeartPulse size={18} color={c} />
                        <div>
                          <div style={{ fontWeight: 700 }}>{b.systolic}/{b.diastolic} {b.pulse ? `· نبض ${b.pulse}` : ""}</div>
                          <div style={{ fontSize: 12, color: "#999" }}>{fmtDate(b.date)} · {fmtTime(b.at)}</div>
                        </div>
                      </div>
                      <button onClick={() => onRemoveBP(b.id)} style={styles.iconBtn}><IX size={16} /></button>
                    </div>
                  );
                })}
              </div>
            )}
          </section>
        </>
      )}

      {section === "lab" && (
        <>
          <section style={styles.card}>
            <div style={styles.cardTitle}>نتائج التحاليل الشهرية</div>
            <div style={{ fontSize: 12, color: "#8a8a8a", marginBottom: 10 }}>سجّلها زي ما هي في ورقة التحليل — التطبيق مش بديل عن رأي الدكتور</div>
            <button onClick={onAddLab} style={styles.primaryBtn}><IPlus size={18} /> سجّل تحليل جديد</button>
          </section>
          <section>
            <div style={styles.sectionTitle}>السجل</div>
            {sortedL.length === 0 ? <div style={styles.empty}>لسه مفيش تحاليل مسجّلة</div> : (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {sortedL.map((l) => (
                  <div key={l.id} style={{ ...styles.card, padding: 14 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                      <span style={{ fontWeight: 800, fontSize: 13 }}>{fmtDate(l.date)}</span>
                      <button onClick={() => onRemoveLab(l.id)} style={styles.iconBtn}><IX size={14} /></button>
                    </div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                      {LAB_TYPES.filter((t) => l[t.key] != null).map((t) => {
                        const flag = labFlag(t, l[t.key]);
                        return (
                          <div key={t.key} style={{ display: "flex", alignItems: "center", gap: 5, background: SAND, borderRadius: 8, padding: "5px 9px", fontSize: 12 }}>
                            <FlagDot level={flag} /><span style={{ color: "#666" }}>{t.label}:</span><span style={{ fontWeight: 800 }}>{l[t.key]}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </section>
        </>
      )}

      {section === "session" && (
        <>
          <section style={styles.card}>
            <div style={styles.cardTitle}>جلسات الغسيل</div>
            <div style={{ fontSize: 12, color: "#8a8a8a", marginBottom: 10 }}>سجّل كل جلسة — الحضور والغياب مهمين للمتابعة</div>
            <button onClick={onAddSession} style={styles.primaryBtn}><IPlus size={18} /> سجّل جلسة</button>
          </section>
          <section>
            <div style={styles.sectionTitle}>السجل</div>
            {sortedS.length === 0 ? <div style={styles.empty}>لسه مفيش جلسات مسجّلة</div> : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {sortedS.map((s) => (
                  <div key={s.id} style={styles.logRow}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      {s.attended ? <ICheck size={18} color={SAGE} /> : <IAlert size={18} color={CORAL} />}

                        <div style={{ fontWeight: 700, color: s.attended ? INK : CORAL }}>{fmtDate(s.date)} · {s.attended ? "حضر" : "غاب"}</div>
                        {s.note ? <div style={{ fontSize: 12, color: "#999" }}>{s.note}</div> : null}

                    </div>
                    <button onClick={() => onRemoveSession(s.id)} style={styles.iconBtn}><IX size={16} /></button>
                  </div>
                ))}
              </div>
            )}
          </section>
        </>
      )}
    </div>
  );
}

function QuizTab({ onExit }) {
  const [i, setI] = useState(0), [picked, setPicked] = useState(null), [score, setScore] = useState(0), [done, setDone] = useState(false);
  const q = QUIZ[i];
  const choose = (idx) => { if (picked !== null) return; setPicked(idx); if (idx === q.correct) setScore((s) => s + 1); };
  const next = () => { if (i + 1 >= QUIZ.length) { setDone(true); return; } setI(i + 1); setPicked(null); };
  const restart = () => { setI(0); setPicked(null); setScore(0); setDone(false); };

  if (done) {
    const good = score >= 4;
    return (
      <div style={{ ...styles.card, textAlign: "center", padding: 28, animation: "rise .35s ease" }}>
        <div style={{ fontSize: 40, marginBottom: 8 }}>{good ? "🎉" : "💪"}</div>
        <div style={{ fontWeight: 800, fontSize: 19, marginBottom: 6 }}>{score} من {QUIZ.length} صح</div>
        <div style={{ color: "#8a8a8a", fontSize: 13.5, marginBottom: 20, lineHeight: 1.7 }}>{good ? "معلوماتك عن نظامك الغذائي كويسة جدًا، كمّل كده!" : "مفيش مشكلة، راجع الكروت في التثقيف وجرب تاني."}</div>
        <div style={{ display: "flex", gap: 10 }}>
          <button onClick={restart} style={{ ...styles.primaryBtn, marginTop: 0, background: SAND, color: DEEP, border: `1px solid ${LINE}` }}><IRotate size={16} /> اعاد المحاولة</button>
          <button onClick={onExit} style={{ ...styles.primaryBtn, marginTop: 0 }}>رجوع للتثقيف</button>
        </div>
      </div>
    );
  }
  return (
    <div style={{ animation: "rise .35s ease" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <button onClick={onExit} style={{ ...styles.iconBtn, width: "auto", padding: "6px 10px", display: "flex", gap: 6 }}><IArrowLeft size={15} /> رجوع</button>
        <div style={{ fontSize: 13, color: "#8a8a8a", fontWeight: 700 }}>سؤال {i + 1} من {QUIZ.length}</div>
      </div>
      <div style={{ height: 5, background: LINE, borderRadius: 5, marginBottom: 18, overflow: "hidden" }}>
        <div style={{ height: "100%", width: `${((i + (picked !== null ? 1 : 0)) / QUIZ.length) * 100}%`, background: DEEP, transition: "width .3s" }} />
      </div>
      <div style={styles.card}>
        <div style={{ fontWeight: 800, fontSize: 16.5, marginBottom: 16, lineHeight: 1.6 }}>{q.q}</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {q.options.map((opt, idx) => {
            let bg = "#fff", border = LINE, color = INK;
            if (picked !== null) {
              if (idx === q.correct) { bg = "#EAF4EE"; border = SAGE; color = SAGE; }
              else if (idx === picked) { bg = "#FBEAE8"; border = CORAL; color = CORAL; }
            }
            return (
              <button key={idx} onClick={() => choose(idx)} style={{ textAlign: "right", padding: "13px 14px", borderRadius: 12, border: `1.5px solid ${border}`, background: bg, color, fontSize: 14.5, fontWeight: 700, cursor: picked === null ? "pointer" : "default", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                {opt}
                {picked !== null && idx === q.correct && <ICheck size={17} color={SAGE} />}
                {picked !== null && idx === picked && idx !== q.correct && <IX size={17} color={CORAL} />}
              </button>
            );
          })}
        </div>
        {picked !== null && <div style={{ marginTop: 14, background: SAND, borderRadius: 12, padding: 12, fontSize: 13.5, lineHeight: 1.7, color: "#444", display: "flex", gap: 8 }}><IInfo size={16} color={DEEP} />{q.exp}</div>}
      </div>
      {picked !== null && <button onClick={next} style={styles.primaryBtn}>{i + 1 >= QUIZ.length ? "اعرض النتيجة" : "السؤال اللي بعده"}</button>}
    </div>
  );
}

function KidneyAnim({ healthy }) {

  const cleanColor = healthy ? "#5C8A6E" : "#8a8a8a";
  const wasteColor = healthy ? "#D9A441" : "#C4453B";
  return (
    <div style={{ position: "relative", width: 220, height: 220, margin: "0 auto" }}>
      <svg width="220" height="220" viewBox="0 0 220 220">

        <path d="M110 60 C145 60 150 90 150 110 C150 135 140 160 112 160 C90 160 80 145 88 128 C96 138 108 132 104 118 C100 106 90 110 86 100 C80 84 92 60 110 60 Z"
          fill={healthy ? "#C4453B" : "#8B4A44"} opacity="0.9" />
        <path d="M110 60 C145 60 150 90 150 110 C150 135 140 160 112 160 C90 160 80 145 88 128"
          fill="none" stroke="#7a2f2a" strokeWidth="2" opacity="0.5" />
        <path d="M 78 118 Q 60 118 30 118" fill="none" stroke={cleanColor} strokeWidth="6" strokeLinecap="round" opacity="0.85" />
        <path d="M110 160 Q 108 180 110 195" fill="none" stroke={wasteColor} strokeWidth="5" strokeLinecap="round" opacity="0.85" />
        <ellipse cx="110" cy="205" rx="16" ry="10" fill={healthy ? "#D9A441" : "#5a4a2a"} opacity="0.85" />
        {healthy ? (
          <>
            {[0, 0.33, 0.66].map((d, i) => (<circle key={"a" + i} r="4" fill={bloodColor}><animateMotion dur="1.8s" begin={`${d}s`} repeatCount="indefinite" path="M 30 90 Q 60 90 78 100" /></circle>))}
            {[0, 0.4, 0.8].map((d, i) => (<circle key={"v" + i} r="4" fill={cleanColor}><animateMotion dur="1.6s" begin={`${d}s`} repeatCount="indefinite" path="M 78 118 Q 60 118 30 118" /></circle>))}
            {[0, 0.6].map((d, i) => (<circle key={"u" + i} r="3" fill={wasteColor}><animateMotion dur="1.4s" begin={`${d}s`} repeatCount="indefinite" path="M110 160 Q 108 180 110 195" /></circle>))}
          </>
        ) : (
          <>
            <circle r="4" fill={bloodColor}><animateMotion dur="3s" repeatCount="indefinite" path="M 30 90 Q 60 90 78 100" /></circle>
            {[0, 0.4, 0.8, 1.2, 1.6].map((d, i) => (<circle key={"jam" + i} cx={95 + i * 6} cy={108 + (i % 2) * 8} r="4.5" fill={CORAL} opacity="0.9"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.2s" begin={`${d * 0.2}s`} repeatCount="indefinite" /></circle>))}
          </>
        )}
      </svg>
      {!healthy && <div style={{ position: "absolute", top: 6, left: 6, background: CORAL, color: "#fff", fontSize: 10, fontWeight: 800, padding: "3px 8px", borderRadius: 20 }}>سموم متراكمة</div>}
    </div>
  );
}

function Onboarding({ onDone }) {
  const [step, setStep] = useState(0), [v, setV] = useState("1000");
  const slides = [
    { icon: "💧", title: "أهلاً بيك في رِفيق", body: "تطبيق بيساعدك تتابع سوائلك وأكلك ووزنك وتفهم نظامك الغذائي وانت على الغسيل الكلوي — يوم بيوم." },
    { anim: "healthy", title: "الكلى السليمة بتشتغل كده", body: "الكلى بتفلتر الدم كل ثانية — بتسحب السموم والمياه الزيادة وبتحوّلها بول، وبترجّع الدم نضيف تاني للجسم. شغل مستمر ٢٤ ساعة." },
    { anim: "sick", title: "لما الكلى تتعب", body: "في الفشل الكلوي، الكلى مبقتش تقدر تفلتر كويس — السموم والمياه الزيادة بتتراكم في الدم بدل ما تتشال. عشان كده الغسيل الكلوي بيعمل شغل الكلى بدلها، والنظام الغذائي بيقلل الحمل عليها." },
  ];
  return (
    <div dir="rtl" style={{ ...styles.app, minHeight: "100vh", justifyContent: "center", alignItems: "center", display: "flex" }}>
      <div style={{ width: "100%", maxWidth: 380, padding: 28, textAlign: "center" }}>
        {step < slides.length ? (
          <>
            {slides[step].anim ? <KidneyAnim healthy={slides[step].anim === "healthy"} /> : <div style={{ fontSize: 56, marginBottom: 18 }}>{slides[step].icon}</div>}
            <div style={{ fontWeight: 800, fontSize: 21, marginTop: 14, marginBottom: 10 }}>{slides[step].title}</div>
            <div style={{ color: "#666", fontSize: 14.5, lineHeight: 1.8, marginBottom: 22 }}>{slides[step].body}</div>
            <div style={{ display: "flex", justifyContent: "center", gap: 6, marginBottom: 18 }}>
              {slides.map((_, i) => <div key={i} style={{ width: i === step ? 20 : 7, height: 7, borderRadius: 6, background: i === step ? DEEP : LINE, transition: "all .25s" }} />)}
            </div>
            <button onClick={() => setStep(step + 1)} style={styles.primaryBtn}>{step === slides.length - 1 ? "فهمت، يلا نبدأ" : "التالي"}</button>
            {step === 0 && (
              <div style={{ marginTop: 26, fontSize: 11.5, color: "#aaa", lineHeight: 1.7 }}>
                <div style={{ fontWeight: 700, color: "#8a8a8a" }}>عمل م/ محمود شريف شافعي</div>
                <div>كلية تمريض جامعة العاصمة (مقاصة) 2026</div>
              </div>
            )}
          </>
        ) : (
          <>
            <div style={{ fontSize: 44, marginBottom: 14 }}>🥤</div>
            <div style={{ fontWeight: 800, fontSize: 19, marginBottom: 10 }}>الحد اليومي بتاعك كام مل؟</div>
            <input value={v} onChange={(e) => setV(e.target.value.replace(/\D/g, ""))} inputMode="numeric" style={{ ...styles.input, textAlign: "center", fontSize: 22, fontWeight: 800, color: DEEP }} />
            <div style={{ fontSize: 12, color: "#999", marginTop: 8, marginBottom: 22 }}>تقدر تغيّرها بعدين من الرئيسية في أي وقت</div>
            <button onClick={() => { const n = parseInt(v, 10); onDone(n > 0 ? n : 1000); }} style={styles.primaryBtn}>ابدأ المتابعة</button>
          </>
        )}
      </div>
    </div>
  );
}

// ---- Shown every time the app opens (after first-time onboarding is done): kidney comparison + a fact that rotates each open ----
function DailySplash({ onDone }) {
  const [step, setStep] = useState(0);
  const ALL_TIPS = [...NUTRIENTS, ...DIALYSIS_INFO];
  const [tip, setTip] = useState(ALL_TIPS[0]);
  const [tipIdx, setTipIdx] = useState(0);

  useEffect(() => {
    (async () => {
      let idx = 0;
      try { const r = await store.get("rf-splash-idx"); idx = r && r.value ? (parseInt(r.value, 10) + 1) % ALL_TIPS.length : 0; } catch (e) {}
      setTipIdx(idx);
      setTip(ALL_TIPS[idx]);
      try { await store.set("rf-splash-idx", String(idx)); } catch (e) {}
    })();
  }, []);

  const slides = [
    { anim: "healthy", title: "الكلى السليمة", body: "بتفلتر الدم من السموم وبتنظّمه، شغل مستمر بدون توقف." },
    { anim: "sick", title: "الفشل الكلوي", body: "الكلى مبتقدرش تفلتر، والسموم بتتراكم — عشان كده الغسيل والنظام الغذائي مهمين." },
    { tip: true, title: `معلومة النهاردة · ${tip.title} ${tip.icon}`, body: tip.tips[0] },
  ];
  const s = slides[step];
  return (
    <div dir="rtl" style={{ ...styles.app, minHeight: "100vh", justifyContent: "center", alignItems: "center", display: "flex" }}>
      <div style={{ width: "100%", maxWidth: 380, padding: 28, textAlign: "center" }}>
        {s.anim ? <KidneyAnim healthy={s.anim === "healthy"} /> : <div style={{ fontSize: 46, marginBottom: 14 }}>💡</div>}
        <div style={{ fontWeight: 800, fontSize: 20, marginTop: 14, marginBottom: 10 }}>{s.title}</div>
        <div style={{ color: "#666", fontSize: 14, lineHeight: 1.8, marginBottom: 22 }}>{s.body}</div>
        <div style={{ display: "flex", justifyContent: "center", gap: 6, marginBottom: 18 }}>
          {slides.map((_, i) => <div key={i} style={{ width: i === step ? 20 : 7, height: 7, borderRadius: 6, background: i === step ? DEEP : LINE, transition: "all .25s" }} />)}
        </div>
        <button onClick={() => (step < slides.length - 1 ? setStep(step + 1) : onDone())} style={styles.primaryBtn}>
          {step < slides.length - 1 ? "التالي" : "يلا ندخل"}
        </button>
        {step < slides.length - 1 && <button onClick={onDone} style={{ ...styles.linkBtn, marginTop: 14 }}>تخطّي</button>}
      </div>
    </div>
  );
}
function Sheet({ title, onClose, children }) {
  return (
    <div style={styles.overlay} onClick={onClose}>
      <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
        <div style={styles.sheetHandle} />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontWeight: 800, fontSize: 17 }}>{title}</div>
          <button onClick={onClose} style={styles.iconBtn}><IX size={18} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function AddFluidSheet({ onClose, onAdd }) {
  const [custom, setCustom] = useState("");
  return (
    <Sheet title="سجّل سوائل" onClose={onClose}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginBottom: 16 }}>
        {QUICK_ITEMS.map((it) => (
          <button key={it.label} onClick={() => onAdd(it.ml)} style={styles.quickChip}>
            <div style={{ fontSize: 22 }}>{it.icon}</div><div style={{ fontSize: 12.5, fontWeight: 700 }}>{it.label}</div><div style={{ fontSize: 11, color: "#999" }}>{it.ml} مل</div>
          </button>
        ))}
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <input value={custom} onChange={(e) => setCustom(e.target.value.replace(/\D/g, ""))} placeholder="كمية تانية بالمللي" inputMode="numeric" style={styles.input} />
        <button onClick={() => { if (custom) { onAdd(parseInt(custom, 10)); setCustom(""); } }} style={{ ...styles.primaryBtn, width: 110, marginTop: 0 }}>سجّل</button>
      </div>
    </Sheet>
  );
}

function AddWeightSheet({ onClose, onAdd }) {
  const [pre, setPre] = useState(""), [post, setPost] = useState("");
  const gain = pre && post ? (parseFloat(post) - parseFloat(pre)).toFixed(1) : null;
  return (
    <Sheet title="سجّل وزن الجلسة" onClose={onClose}>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <div><label style={styles.fieldLabel}>الوزن قبل الجلسة (كجم)</label><input value={pre} onChange={(e) => setPre(e.target.value.replace(/[^\d.]/g, ""))} inputMode="decimal" style={styles.input} /></div>
        <div><label style={styles.fieldLabel}>الوزن بعد الجلسة (كجم)</label><input value={post} onChange={(e) => setPost(e.target.value.replace(/[^\d.]/g, ""))} inputMode="decimal" style={styles.input} /></div>
        {gain !== null && !isNaN(gain) && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, color: gain > 3 ? CORAL : gain > 2 ? AMBER : SAGE, fontWeight: 700 }}>
            {gain > 2 ? <IAlert size={16} /> : <ICheck size={16} />} الفرق: {gain} كجم
          </div>
        )}
        <button onClick={() => { if (pre && post) onAdd(parseFloat(pre), parseFloat(post)); }} style={styles.primaryBtn}>حفظ</button>
      </div>
    </Sheet>
  );
}

function FlagDot({ level }) {
  return <span style={{ width: 8, height: 8, borderRadius: 8, background: FLAG_COLORS[level], display: "inline-block" }} />;
}

function AddFoodSheet({ onClose, onAdd }) {
  const [search, setSearch] = useState("");
  const [picked, setPicked] = useState(null);
  const [name, setName] = useState("");
  const [qty, setQty] = useState("");
  const [type, setType] = useState(FOOD_TYPES[0]);
  const [calories, setCalories] = useState("");
  const [protein, setProtein] = useState("");
  const [photo, setPhoto] = useState(null);
  const [snapping, setSnapping] = useState(false);

  const results = useMemo(() => {
    const q = search.trim();
    if (!q) return [];
    return FOOD_DB.filter((f) => f.name.includes(q)).slice(0, 6);
  }, [search]);

  const pick = (f) => {
    setPicked(f);
    setName(f.name);
    setCalories(String(f.cal));
    setProtein(String(f.protein));
    setSearch("");
  };

  const takePhoto = async () => {
    const Cam = CameraPlugin();
    if (!Cam) { alert("الكاميرا شغالة بس جوه تطبيق رِفيق المثبّت"); return; }
    setSnapping(true);
    try {
      const img = await Cam.getPhoto({ quality: 70, resultType: "dataUrl", source: "PROMPT", saveToGallery: false });
      setPhoto(img.dataUrl);
    } catch (e) { /* user cancelled */ }
    setSnapping(false);
  };

  return (
    <Sheet title="سجّل أكل" onClose={onClose}>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <div>
          <label style={styles.fieldLabel}>دوّر في قاعدة الأكل المصري (بيقولّك آمن ولا لأ)</label>
          <input value={search} onChange={(e) => { setSearch(e.target.value); setPicked(null); }} placeholder="اكتب اسم الأكل... مثلاً موز" style={styles.input} />
          {results.length > 0 && (
            <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 6, maxHeight: 200, overflowY: "auto" }}>
              {results.map((f) => (
                <button key={f.name} onClick={() => pick(f)} style={{ ...styles.logRow, cursor: "pointer", fontFamily: "inherit", textAlign: "right" }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 14 }}>{f.name}</div>
                    <div style={{ fontSize: 11, color: "#999" }}>{f.cal} سعرة · {f.protein} جم بروتين</div>
                  </div>
                  <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                    <FlagDot level={f.k} /><FlagDot level={f.p} /><FlagDot level={f.na} />
                  </div>
                </button>
              ))}
            </div>
          )}
        </div>

        {picked && (
          <div style={{ background: SAND, borderRadius: 12, padding: 12 }}>
            <div style={{ display: "flex", gap: 14, marginBottom: picked.note ? 8 : 0 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12 }}><FlagDot level={picked.k} /> بوتاسيوم: {FLAG_LABELS[picked.k]}</div>
              <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12 }}><FlagDot level={picked.p} /> فوسفور: {FLAG_LABELS[picked.p]}</div>
              <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12 }}><FlagDot level={picked.na} /> ملح: {FLAG_LABELS[picked.na]}</div>
            </div>
            {picked.note ? <div style={{ fontSize: 12.5, color: "#666", lineHeight: 1.6 }}>{picked.note}</div> : null}
          </div>
        )}

        <div style={{ display: "flex", alignItems: "center", gap: 8, color: "#aaa", fontSize: 12 }}>
          <div style={{ flex: 1, height: 1, background: LINE }} /> أو سجّل يدويًا <div style={{ flex: 1, height: 1, background: LINE }} />
        </div>

        <button onClick={takePhoto} disabled={snapping} style={{ ...styles.card, padding: 0, overflow: "hidden", cursor: "pointer", border: `1.5px dashed ${LINE}`, height: photo ? 140 : 70 }}>
          {photo ? (
            <img src={photo} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
          ) : (
            <div style={{ height: "100%", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 6, color: DEEP }}>
              <ICamera size={22} />
              <span style={{ fontSize: 12.5, fontWeight: 700 }}>{snapping ? "بيفتح الكاميرا…" : "صوّر الأكل (اختياري، للتسجيل الشخصي)"}</span>
            </div>
          )}
        </button>
        <div><label style={styles.fieldLabel}>اسم الأكل</label><input value={name} onChange={(e) => { setName(e.target.value); setPicked(null); }} placeholder="مثلاً: صدر فراخ مشوي" style={styles.input} /></div>
        <div style={{ display: "flex", gap: 8 }}>
          <div style={{ flex: 1 }}><label style={styles.fieldLabel}>الكمية</label><input value={qty} onChange={(e) => setQty(e.target.value)} placeholder="طبق، ٢ قطعة..." style={styles.input} /></div>
          <div style={{ flex: 1 }}>
            <label style={styles.fieldLabel}>الوجبة</label>
            <select value={type} onChange={(e) => setType(e.target.value)} style={{ ...styles.input, appearance: "none" }}>
              {FOOD_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
            </select>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <div style={{ flex: 1 }}><label style={styles.fieldLabel}>السعرات (تقريبي)</label><input value={calories} onChange={(e) => setCalories(e.target.value.replace(/\D/g, ""))} inputMode="numeric" style={styles.input} /></div>
          <div style={{ flex: 1 }}><label style={styles.fieldLabel}>بروتين (جم)</label><input value={protein} onChange={(e) => setProtein(e.target.value.replace(/\D/g, ""))} inputMode="numeric" style={styles.input} /></div>
        </div>
        <button
          onClick={() => { if (name) onAdd({ name, qty, type, calories: calories ? +calories : null, protein: protein ? +protein : null, photo, k: picked?.k, p: picked?.p, na: picked?.na }); }}
          style={styles.primaryBtn}
        >
          حفظ
        </button>
      </div>
    </Sheet>
  );
}

function AddBPSheet({ onClose, onAdd }) {
  const [sys, setSys] = useState(""), [dia, setDia] = useState(""), [pulse, setPulse] = useState("");
  return (
    <Sheet title="سجّل ضغط الدم" onClose={onClose}>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <div style={{ display: "flex", gap: 8 }}>
          <div style={{ flex: 1 }}><label style={styles.fieldLabel}>الانقباضي (العالي)</label><input value={sys} onChange={(e) => setSys(e.target.value.replace(/\D/g, ""))} inputMode="numeric" style={styles.input} /></div>
          <div style={{ flex: 1 }}><label style={styles.fieldLabel}>الانبساطي (الواطي)</label><input value={dia} onChange={(e) => setDia(e.target.value.replace(/\D/g, ""))} inputMode="numeric" style={styles.input} /></div>
        </div>
        <div><label style={styles.fieldLabel}>النبض (اختياري)</label><input value={pulse} onChange={(e) => setPulse(e.target.value.replace(/\D/g, ""))} inputMode="numeric" style={styles.input} /></div>
        <button onClick={() => { if (sys && dia) onAdd(+sys, +dia, pulse ? +pulse : null); }} style={styles.primaryBtn}>حفظ</button>
      </div>
    </Sheet>
  );
}

function AddLabSheet({ onClose, onAdd }) {
  const [vals, setVals] = useState({});
  const setVal = (key, v) => setVals((prev) => ({ ...prev, [key]: v.replace(/[^\d.]/g, "") }));
  const save = () => {
    const out = {};
    LAB_TYPES.forEach((t) => { if (vals[t.key]) out[t.key] = parseFloat(vals[t.key]); });
    if (Object.keys(out).length > 0) onAdd(out);
  };
  return (
    <Sheet title="سجّل نتيجة تحليل" onClose={onClose}>
      <div style={{ fontSize: 12.5, color: "#888", marginBottom: 12, lineHeight: 1.7 }}>سجّل بس اللي عندك من ورقة التحليل — مش لازم تملأ كل الخانات</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {LAB_TYPES.map((t) => (
          <div key={t.key} style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <label style={{ ...styles.fieldLabel, marginBottom: 0, width: 130, flexShrink: 0 }}>{t.label}{t.unit ? ` (${t.unit})` : ""}</label>
            <input value={vals[t.key] || ""} onChange={(e) => setVal(t.key, e.target.value)} inputMode="decimal" style={styles.input} />
          </div>
        ))}
        <button onClick={save} style={styles.primaryBtn}>حفظ</button>
      </div>
    </Sheet>
  );
}

function AddSessionSheet({ onClose, onAdd }) {
  const [attended, setAttended] = useState(true);
  const [note, setNote] = useState("");
  return (
    <Sheet title="سجّل جلسة غسيل" onClose={onClose}>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => setAttended(true)} style={{ flex: 1, padding: "12px 0", borderRadius: 12, border: `1.5px solid ${attended ? SAGE : LINE}`, background: attended ? "#EAF4EE" : "#fff", fontWeight: 800, fontSize: 14, color: attended ? SAGE : "#666", cursor: "pointer", fontFamily: "inherit" }}>✓ حضرت</button>
          <button onClick={() => setAttended(false)} style={{ flex: 1, padding: "12px 0", borderRadius: 12, border: `1.5px solid ${!attended ? CORAL : LINE}`, background: !attended ? "#FBEAE8" : "#fff", fontWeight: 800, fontSize: 14, color: !attended ? CORAL : "#666", cursor: "pointer", fontFamily: "inherit" }}>✗ غبت</button>
        </div>
        <div><label style={styles.fieldLabel}>ملاحظة (اختياري)</label><input value={note} onChange={(e) => setNote(e.target.value)} placeholder="مثلاً: أجّلت الجلسة يومين" style={styles.input} /></div>
        <button onClick={() => onAdd(attended, note)} style={styles.primaryBtn}>حفظ</button>
      </div>
    </Sheet>
  );
}

function EditLimitSheet({ limit, onClose, onSave }) {
  const [v, setV] = useState(String(limit));
  return (
    <Sheet title="الحد اليومي للسوائل" onClose={onClose}>
      <div style={{ fontSize: 13, color: "#888", marginBottom: 10, lineHeight: 1.7 }}>اسأل دكتورك عن الكمية المسموحة بالظبط ليك، وحطّها هنا عشان نساعدك تتابعها.</div>
      <input value={v} onChange={(e) => setV(e.target.value.replace(/\D/g, ""))} inputMode="numeric" style={styles.input} />
      <button onClick={() => { const n = parseInt(v, 10); if (n > 0) onSave(n); }} style={styles.primaryBtn}>حفظ</button>
    </Sheet>
  );
}

function NavBtn({ active, onClick, icon, label }) {
  return <button onClick={onClick} style={{ ...styles.navBtn, color: active ? DEEP : "#9aa39a" }}>{icon}<span style={{ fontSize: 10.5, fontWeight: active ? 800 : 600 }}>{label}</span></button>;
}

  app: { fontFamily: "'Tajawal', sans-serif", background: SAND, minHeight: "100vh", display: "flex", flexDirection: "column", color: INK, maxWidth: 480, margin: "0 auto" },
  header: { padding: "22px 20px 16px", background: DEEP, color: "#fff", borderRadius: "0 0 22px 22px" },
  brandRow: { display: "flex", alignItems: "center", gap: 10 },
  brandMark: { width: 34, height: 34, borderRadius: 10, background: "rgba(255,255,255,.18)", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 17 },
  brandName: { fontSize: 21, fontWeight: 800 },
  brandSub: { fontSize: 12.5, opacity: 0.85, marginTop: 4, marginRight: 44 },
  main: { flex: 1, padding: "16px 16px 100px", overflowY: "auto" },
  card: { background: CARD, borderRadius: 18, padding: 18, boxShadow: "0 1px 3px rgba(14,43,43,.06)", border: `1px solid ${LINE}` },
  cardTitle: { fontWeight: 800, fontSize: 15.5 },
  sectionTitle: { fontWeight: 800, fontSize: 14.5, marginBottom: 10, color: "#555" },
  miniLabel: { fontSize: 12.5, color: "#8a8a8a", marginBottom: 4 },
  primaryBtn: { width: "100%", marginTop: 14, background: DEEP, color: "#fff", border: "none", borderRadius: 12, padding: "12px 0", fontFamily: "inherit", fontWeight: 800, fontSize: 14.5, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, cursor: "pointer" },
  linkBtn: { background: "none", border: "none", color: DEEP, fontFamily: "inherit", fontSize: 12.5, fontWeight: 700, cursor: "pointer", padding: 0 },
  logRow: { background: CARD, border: `1px solid ${LINE}`, borderRadius: 12, padding: "10px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" },
  logDot: { width: 8, height: 8, borderRadius: 8, background: DEEP },
  iconBtn: { background: "#F1EEE6", border: "none", borderRadius: 8, width: 30, height: 30, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: "#888" },
  empty: { textAlign: "center", color: "#9a9a9a", fontSize: 13.5, padding: "22px 10px", background: "#fff", borderRadius: 14, border: `1px dashed ${LINE}` },

  fab: { position: "fixed", bottom: 84, left: 18, width: 52, height: 52, borderRadius: 26, background: `linear-gradient(135deg, ${PLUM}, #6f4f8f)`, border: "none", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 4px 14px rgba(139,107,174,.45)", cursor: "pointer", zIndex: 40 },
  overlay: { position: "fixed", inset: 0, background: "rgba(14,43,43,.35)", display: "flex", alignItems: "flex-end", zIndex: 50 },
  sheet: { background: "#fff", width: "100%", maxWidth: 480, margin: "0 auto", borderRadius: "22px 22px 0 0", padding: "10px 20px 28px", animation: "rise .25s ease" },
  sheetHandle: { width: 40, height: 4, background: LINE, borderRadius: 4, margin: "4px auto 14px" },
  quickChip: { background: SAND, border: `1px solid ${LINE}`, borderRadius: 14, padding: "12px 4px", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, cursor: "pointer", fontFamily: "inherit" },
  input: { flex: 1, border: `1px solid ${LINE}`, borderRadius: 12, padding: "12px 14px", fontSize: 15, fontFamily: "inherit", width: "100%", background: "#fff" },
  fieldLabel: { fontSize: 12.5, color: "#888", marginBottom: 6, display: "block", fontWeight: 700 },
  toast: { position: "fixed", bottom: 90, left: "50%", transform: "translateX(-50%)", background: INK, color: "#fff", padding: "10px 18px", borderRadius: 30, fontSize: 13.5, fontWeight: 700, zIndex: 60, animation: "rise .25s ease" },
};

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
