name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تجهيز مجلد الويب
        run: |
          mkdir www
          shopt -s extglob dotglob
          mv !(www|node_modules|android|package.json|package-lock.json|capacitor.config.json|.github|.git) www/ 2>/dev/null || true
          ls -la www

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pre-accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "601085b94cd77f0b54ff86406957099ebe79c4d" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          echo "859f317696f67ef3d7f30a50a5560e7834b43903" > "$ANDROID_HOME/licenses/google-gdk-license"
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97" > "$ANDROID_HOME/licenses/intel-android-extra-license"
          echo "d975f751698a77b662f1254ddbeed3901e976f5" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo "9927b5f38dbf6bc4bb9b91a04e0da4ce2c0d5be1" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"
          echo "sdk.dir=$ANDROID_HOME" > local.properties.template

      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android

      - name: بناء APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rafiiq-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
