name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تجهيز مجلد الويب
        run: |
          mkdir www
          shopt -s extglob dotglob
          mv !(www|node_modules|android|package.json|package-lock.json|capacitor.config.json|.github|.git) www/ 2>/dev/null || true
          ls -la www

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: android-actions/setup-android@v3

      - run: npm insta
